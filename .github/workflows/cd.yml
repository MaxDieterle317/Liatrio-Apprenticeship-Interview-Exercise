name: CD Pipeline

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read 

jobs:
  deploy:
    if: ${{github.event.workflow_run.conclusion == 'success'}}
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{vars.AZURE_CLIENT_ID}}
          tenant-id: ${{vars.AZURE_TENANT_ID}}
          subscription-id: ${{vars.AZURE_SUBSCRIPTION_ID}}
      - name: Deploy to Azure Container
        run: |
          az containerapp update \
            --name liatrio-app \
            --resource-group liatrio-apprenticeship-exercise \
            --image ${{vars.DOCKERHUB_USERNAME}}/${{vars.DOCKERHUB_REPOSITORY}}:${{github.event.workflow_run.run_number}}


